[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/chat"
  to     = "/.netlify/functions/chat"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options        = "SAMEORIGIN"
      X-Content-Type-Options = "nosniff"
