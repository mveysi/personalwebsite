<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Publications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="chatbot.css">
    <style>
        html {
            overflow-x: hidden;
            width: 100%;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333;
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }
        .layout {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
        }
        .sidebar {
            width: 200px;
            padding: 3rem 1.5rem 3rem 0;
            border-right: 1px solid #eee;
        }
        .side-nav {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .side-nav a {
            color: #666;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.25rem 0;
            transition: color 0.2s ease;
        }
        .side-nav a:hover {
            color: #000;
        }
        .side-nav a.active {
            color: #000;
            font-weight: 600;
        }
        .lang-switcher {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background-color: #f1f5ff;
            border-radius: 999px;
            padding: 0.25rem;
            font-size: 0.85rem;
            position: fixed;
            top: 3rem;
            right: 1rem;
            z-index: 1000;
        }
        .lang-btn {
            border: none;
            background: transparent;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #333;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .lang-btn.active {
            background-color: #007bff;
            color: #fff;
        }
        .lang-btn:not(.active):hover {
            background-color: #e0e7ff;
        }
        .main-content {
            flex: 1;
            padding: 3rem 2rem;
        }
        .header {
            text-align: left;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 1rem;
        }
        .header h1 {
            margin: 0 0 0.25rem 0;
        }
        .timeline {
            margin-top: 2.5rem;
        }
        .publication-entry {
            text-align: center;
            margin-bottom: 4rem;
        }
        .entry-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        .entry-description {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 1.25rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .entry-separator {
            width: 80px;
            height: 1px;
            background-color: #ddd;
            margin: 0 auto 1.5rem;
        }
        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                padding: 1rem;
                border-right: none;
                border-bottom: 1px solid #eee;
                box-sizing: border-box;
            }
            .side-nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
            .main-content {
                padding: 2rem 1rem;
                width: 100%;
                box-sizing: border-box;
            }
            .header {
                text-align: center;
                margin-bottom: 1.5rem;
            }
            .lang-switcher {
                top: 3rem;
                right: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <nav class="side-nav">
                <a href="index.html" data-i18n="nav_about">About</a>
                <a href="education.html" data-i18n="nav_education">Education</a>
                <a href="experience.html" data-i18n="nav_experience">Experience</a>
                <a href="competitions.html" data-i18n="nav_competitions">Competitions</a>
                <a href="publications.html" class="active" data-i18n="nav_publications">Publications</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1 data-i18n="title">Publications</h1>
            </div>

            <section class="timeline">
                <article class="publication-entry">
                    <h2 class="entry-title" data-i18n="pub_title">Publications</h2>
                    <p class="entry-description" data-i18n="pub_desc">I do not have any published work yet.</p>
                    <div class="entry-separator"></div>
                </article>
            </section>
        </main>
    </div>

    <div class="lang-switcher" aria-label="Language switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="tr">TR</button>
    </div>

    <script>
        (function() {
            const translations = {
                tr: {
                    title: "Yayınlar",
                    hero_name: "@ Muhammet Veysi Kahraman",
                    hero_role: "Öğrenci",
                    nav_about: "Hakkımda",
                    nav_education: "Eğitim",
                    nav_experience: "Deneyimler",
                    nav_competitions: "Yarışmalar",
                    nav_publications: "Yayınlar",
                    pub_title: "Yayınlar",
                    pub_desc: "Henüz yayınlanmış bir çalışmam bulunmamaktadır."
                },
                en: {
                    title: "Publications",
                    hero_name: "@ Muhammet Veysi Kahraman",
                    hero_role: "Student",
                    nav_about: "About",
                    nav_education: "Education",
                    nav_experience: "Experience",
                    nav_competitions: "Competitions",
                    nav_publications: "Publications",
                    pub_title: "Publications",
                    pub_desc: "I do not have any published work yet."
                }
            };

            function setLanguage(lang) {
                const dict = translations[lang] || translations.tr;
                document.documentElement.lang = lang;
                document.querySelectorAll("[data-i18n]").forEach(function(el) {
                    const key = el.getAttribute("data-i18n");
                    if (dict[key]) {
                        el.textContent = dict[key];
                    }
                });
                document.querySelectorAll(".lang-btn").forEach(function(btn) {
                    btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
                });
                try {
                    localStorage.setItem("lang", lang);
                } catch (e) {}
            }

            document.querySelectorAll(".lang-btn").forEach(function(btn) {
                btn.addEventListener("click", function() {
                    const lang = btn.getAttribute("data-lang");
                    setLanguage(lang);
                });
            });

            let initialLang = "en";
            try {
                const saved = localStorage.getItem("lang");
                if (saved && (saved === "tr" || saved === "en")) {
                    initialLang = saved;
                }
            } catch (e) {}
            setLanguage(initialLang);
        })();
    </script>
    <script src="chatbot.js"></script>
</body>
</html>
